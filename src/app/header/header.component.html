<header class="site-header">
  <div class="logo-container">
    <a routerLink="/">
      <img src="../../assets/img/RyuutamaLogo.png"
           alt="Logo Completo Ryuutama: Um RPG de Fantasia Natural"
           class="logo-desktop">

      <img src="../../assets/img/RyuutamaLogoModile.png"
           alt="Ícone Ryuutama"
           class="logo-mobile">
    </a>
  </div>
  <button class="mobile-nav-toggle" (click)="toggleMobileMenu()" aria-label="Alternar menu">
    ☰
    </button>

  <nav class="main-navigation" [class.mobile-nav-open]="isMobileMenuOpen" *ngIf="isMobileMenuOpen || !isMobileView">
    <ul>
      <li><a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Início</a></li>
      <li><a routerLink="/classes" routerLinkActive="active-link" (click)="closeMobileMenu()">Viajantes</a></li>
      <li><a routerLink="/ryuujin" routerLinkActive="active-link" (click)="closeMobileMenu()">Ryuujin (Mestres)</a></li>
      <li><a routerLink="/mundo" routerLinkActive="active-link" (click)="closeMobileMenu()">Criação de Mundo</a></li>
      <li><a routerLink="/como-jogar" routerLinkActive="active-link" (click)="closeMobileMenu()">Como se Joga</a>
      <li><a routerLink="/recursos" routerLinkActive="active-link" (click)="closeMobileMenu()">Recursos</a></li>
    </ul>
  </nav>
</header>
